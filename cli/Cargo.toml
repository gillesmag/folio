[package]
name = "folio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Push, read and comment on markdown documents in Folio"
repository = "https://github.com/gillesmag/folio"

[[bin]]
name = "folio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
dirs = "7"
keyring = "4"
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
toml = "1"
